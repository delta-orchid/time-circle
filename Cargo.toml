[package]
name = "time-circle"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31"
egui = "0.31"
rustysynth = "1.3"
midly = "0.5"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
base64 = "0.22"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.15"
rfd = "0.15"
tungstenite = "0.24"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlCanvasElement",
    "HtmlAnchorElement",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "WebSocket",
    "MessageEvent",
    "BinaryType",
    "CloseEvent",
    "ErrorEvent",
    "Location",
    "AudioContext",
    "AudioContextOptions",
    "AudioBuffer",
    "AudioDestinationNode",
    "AudioNode",
    "AudioProcessingEvent",
    "ScriptProcessorNode",
] }
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
